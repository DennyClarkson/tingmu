[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tingmu"
version = "0.12.0"
description = "Local video player and language-learning companion"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.8,<7", "pysubs2>=1.7,<2",
  "pycantonese>=3.4,<4", "pypinyin>=0.53,<1", "faster-whisper>=1.1,<2",
  "setuptools<81",
  "opencc-python-reimplemented>=0.1.7,<1",
  "numpy>=1.26,<3", "onnxruntime>=1.17,<2",
  "filelock>=3.12,<5", "huggingface-hub>=1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11"]
gpu = ["nvidia-cublas-cu12==12.9.2.10", "nvidia-cudnn-cu12>=9.8,<10", "nvidia-cuda-runtime-cu12==12.9.79"]

[tool.uv]
cache-dir = ".cache/uv"
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[project.scripts]
tingmu = "tingmu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tingmu"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
