name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅构建、验收并上传 Actions 构件'
        type: boolean
        default: true
      draft:
        description: '关闭 dry_run 后，将 Release 保存为草稿'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.dry_run || false }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !github.event.deleted
    uses: ./.github/workflows/windows-build.yml

  publish:
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    permissions:
      contents: write
    # Dispatch from a branch and push of the corresponding tag can otherwise race.
    concurrency:
      group: publish-tingmu-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          merge-multiple: true
          path: release
      - name: Verify downloaded ZIP checksum
        working-directory: release
        run: sha256sum --strict --check SHA256SUMS.txt
      - name: Publish the tested commit with generated changelog
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
          VERSION: ${{ needs.build.outputs.version }}
          TESTED_COMMIT: ${{ needs.build.outputs.commit }}
          DRAFT: ${{ inputs.draft || false }}
        run: |
          state=$(gh api graphql -f owner="$GITHUB_REPOSITORY_OWNER" -f repo="${GITHUB_REPOSITORY#*/}" \
            -f tag="$TAG" -f ref="refs/tags/$TAG" \
            -f query='query($owner:String!, $repo:String!, $tag:String!, $ref:String!) {
              repository(owner:$owner, name:$repo) { release(tagName:$tag) { id } ref(qualifiedName:$ref) { id } }
            }' --jq '.data.repository | if .release then "released" elif .ref then "tagged" else "new" end')
          flags=(--target "$TESTED_COMMIT")
          if [[ "$state" == released ]]; then
            echo "Release $TAG already exists. Its assets have been preserved." >&2
            exit 1
          elif [[ "$state" == tagged ]]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq .sha)
            if [[ "$commit" != "$TESTED_COMMIT" ]]; then
              echo "$TAG points to $commit, expected $TESTED_COMMIT." >&2
              exit 1
            fi
            flags+=(--verify-tag)
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "The triggering tag $TAG no longer exists." >&2
            exit 1
          fi
          if [[ "$DRAFT" == true ]]; then flags+=(--draft); fi
          if [[ "${VERSION%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "Tingmu-$VERSION-windows-x64-portable.zip" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "听幕 $TAG" --notes-file release-notes.md \
            --generate-notes "${flags[@]}"
