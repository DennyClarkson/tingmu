name: Windows CI

on:
  push:
    branches: [main]
    paths: &build_paths
      - '**'
      - '!*.md'
      - '!docs/**'
      # Both files ship in the portable archive. Changes to .github/** also always run.
      - THIRD_PARTY_NOTICES.md
      - docs/portable.md
  pull_request:
    branches: [main]
    paths: *build_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/windows-build.yml
